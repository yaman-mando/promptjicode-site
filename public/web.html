<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>PromptjiWeb</title>
<link rel="icon" type="image/svg+xml" href="/img/promptjiweb-mark.svg">
<script>
  // One link for everyone: open the services page in the visitor's phone language.
  (function () {
    var langs = (navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || '']).map(function (l) { return String(l).toLowerCase() })
    var to = '/en/services'
    for (var i = 0; i < langs.length; i++) {
      if (langs[i].indexOf('tr') === 0) { to = '/tr/services'; break }
      if (langs[i].indexOf('ar') === 0) { to = '/services'; break }
      if (langs[i].indexOf('en') === 0) { to = '/en/services'; break }
    }
    location.replace(to + location.search)
  })()
</script>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#120c09;color:#fbf1e4;font:16px/1.6 system-ui,sans-serif}a{color:#e2a15c;margin:0 10px}</style>
</head>
<body>
<noscript><p><a href="/tr/services">Türkçe</a><a href="/en/services">English</a><a href="/services" lang="ar">العربية</a></p></noscript>
</body>
</html>
